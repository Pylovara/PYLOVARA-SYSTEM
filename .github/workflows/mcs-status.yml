name: MCS-Status

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcs-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcs-status:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MCS-Analyse ausführen
        run: bash .mcs_analyzer.sh --write

      - name: Status auf Aktualität prüfen (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- .mcs_status MCS-STATUS.md MCS-STATUS.svg README.md README.WIKI-NOTES)" ]; then
            echo "::error::MCS-Status ist veraltet. Bitte '.mcs_analyzer.sh --write' ausführen und die Statusdateien committen."
            git status --short -- .mcs_status MCS-STATUS.md MCS-STATUS.svg README.md README.WIKI-NOTES
            exit 1
          fi

      - name: Status automatisch committen (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- .mcs_status MCS-STATUS.md MCS-STATUS.svg README.md README.WIKI-NOTES)" ]; then
            echo "MCS-Status ist bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .mcs_status MCS-STATUS.md MCS-STATUS.svg README.md README.WIKI-NOTES
          git commit -m "chore(mcs): Status automatisch aktualisiert [skip ci]"
          git push
