###====================================|====================================###
### MCS-SHELL | KONFIGURATION
### Quelle : /PYLOVARA-SYSTEM/ARBEITERBIENEN/MCS-SHELL/MCS-SHELL.CONF
###====================================|====================================###
### Diese Datei wird von MCS-SHELL und dem Installer gelesen.
### Werte in Anführungszeichen lassen, damit Pfade und Fonts sicher bleiben.
###====================================|====================================###

### TERMINAL-ENGINE
# auto | kitty | foot | alacritty | wezterm | konsole | gnome-terminal |
# xfce4-terminal | xterm
# kitty ist die empfohlene Engine (GPU, Bilder, Unicode, Bash/Zsh).
MCS_SHELL_BACKEND="auto"

### SHELL INNERHALB DES FENSTERS
# auto = $SHELL des Benutzers (z. B. /usr/local/bin/pylovara)
# oder: bash | zsh | /bin/bash | /bin/zsh
MCS_SHELL_SHELL="auto"
MCS_SHELL_LOGIN="1"

### FENSTER
MCS_SHELL_TITLE="MCS-Shell"
MCS_SHELL_CLASS="mcs-shell"
MCS_SHELL_COLS="120"
MCS_SHELL_ROWS="40"

### TOPDOWN-GEOMETRIE (Prozent des fokussierten Monitors)
MCS_SHELL_WIDTH_PERCENT="92"
MCS_SHELL_HEIGHT_PERCENT="62"
MCS_SHELL_TOP_PERCENT="3"

### OPTIK
MCS_SHELL_FONT="FantasqueSansM Nerd Font Mono"
MCS_SHELL_FONT_SIZE="15"
MCS_SHELL_OPACITY="0.94"

### VERHALTEN
# 1 = Aufruf ohne --new toggelt das Dropdown.
MCS_SHELL_TOGGLE="1"
# 1 = neue Fenster werden auf Wunsch floatend und groß gesetzt.
MCS_SHELL_FLOAT_NEW="1"
# 1 = X11-Fenster nach dem Start per xdotool/wmctrl platzieren.
MCS_SHELL_X11_GEOMETRY="1"

### HYPRLAND
# Eigener Special-Workspace fuer das Dropdown.
MCS_SHELL_HYPR_SPECIAL="mcs-shell"

### TASTATUR
# Taste ZUSAMMEN mit Super+Shift. "Return" = Enter.
# Gueltig fuer den Installer: Return | T | Space | ...
MCS_SHELL_KEY="Return"
# 1 = vorhandene Belegung auf Super+Shift+<Taste> wird ersetzt.
MCS_SHELL_KEYBIND_REPLACE="1"

### DEBUG
# 1 = Startkommando und Fehler ausfuehrlich auf stderr ausgeben.
MCS_SHELL_DEBUG="0"

###====================================|====================================###
