###====================================|====================================###
### MCS-SHELL | KITTY-PROFIL
### Wird zusaetzlich zur Benutzer-kitty.conf geladen und ueberschreibt sie.
###====================================|====================================###

font_family FantasqueSansM Nerd Font Mono
font_size 15.0
bold_font auto
italic_font auto
bold_italic_font auto

background #0b0f14
foreground #e8e8e8
selection_foreground #0b0f14
selection_background #ff9f1c
cursor #ff9f1c
cursor_text_color #0b0f14
url_color #5fd7ff

# Pylovara-Palette (Orange als Akzent)
color0  #0b0f14
color1  #ff5f5f
color2  #5fd75f
color3  #ffd75f
color4  #5fafff
color5  #d787ff
color6  #5fd7d7
color7  #d0d0d0
color8  #4e4e4e
color9  #ff8787
color10 #87ff87
color11 #ffff87
color12 #87d7ff
color13 #ff87ff
color14 #87ffff
color15 #ffffff

background_opacity 0.94
dynamic_background_opacity yes
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no

initial_window_width 120c
initial_window_height 40c
window_padding_width 10
placement_strategy center

tab_bar_style hidden
enable_audio_bell no
cursor_trail 1
scrollback_lines 10000
wheel_scroll_min_lines 1
linux_display_server auto
allow_hyperlinks yes
copy_on_select yes
strip_trailing_spaces smart
mouse_hide_wait 2.0

###====================================|====================================###
