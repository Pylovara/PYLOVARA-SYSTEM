# MCS-SHELL | FOOT-PROFIL
# Wird nur genutzt, wenn kitty nicht verfuegbar ist (Wayland).

[main]
font=FantasqueSansM Nerd Font Mono:size=15
pad=10x10
initial-window-size-chars=120x40
app-id=mcs-shell
title=MCS-Shell

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[csd]
preferred=none

[colors]
background=0b0f14
foreground=e8e8e8
selection-foreground=0b0f14
selection-background=ff9f1c
urls=5fd7ff

regular0=0b0f14
regular1=ff5f5f
regular2=5fd75f
regular3=ffd75f
regular4=5fafff
regular5=d787ff
regular6=5fd7d7
regular7=d0d0d0

bright0=4e4e4e
bright1=ff8787
bright2=87ff87
bright3=ffff87
bright4=87d7ff
bright5=ff87ff
bright6=87ffff
bright7=ffffff

[cursor]
color=ff9f1c
